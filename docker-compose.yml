services:
  server:
    build:
      context: ./server
    env_file:
      - .env
    ports:
      - '8000:8000'
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Браузер обращается к серверу напрямую по этому адресу — контейнеры друг другу
        # не проксируют (веб отдаёт статику), поэтому адрес должен быть доступен с хоста.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - '8100:8100'
    depends_on:
      - server
    restart: unless-stopped
